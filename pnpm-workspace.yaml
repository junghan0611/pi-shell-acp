autoInstallPeers: false
allowBuilds:
  '@google/genai': false
  # esbuild arrives with pi 0.85's new @earendil-works/chord (chord's only dependency).
  # Denied like the other two: nothing in this repo executes esbuild — chord reaches us
  # transitively through the pi devDeps we typecheck against, never at runtime — so its
  # postinstall binary download is install-time weight with no consumer. `[측정 2026-09-06]`
  # pnpm wrote this key itself on the first 0.85.1 install and refused to proceed until it
  # carried a decision (ERR_PNPM_IGNORED_BUILDS).
  esbuild: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.85.0 || 0.85.1'
  - '@earendil-works/pi-ai@0.85.0 || 0.85.1'
  - '@earendil-works/pi-client@0.85.0 || 0.85.1'
  - '@earendil-works/pi-coding-agent@0.85.0 || 0.85.1'
  - '@earendil-works/pi-protocol@0.85.0 || 0.85.1'
  - '@earendil-works/pi-telemetry@0.85.0 || 0.85.1'
  - '@earendil-works/pi-tui@0.85.0 || 0.85.1'
  - '@earendil-works/chord@0.85.0 || 0.85.1'
  - '@agentclientprotocol/claude-agent-acp@0.65.0 || 0.66.0 || 0.67.0 || 0.68.0 || 0.69.0 || 0.70.0 || 0.71.0 || 0.72.0 || 0.73.0 || 0.74.0 || 0.75.0 || 0.75.1'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk@0.3.257'
