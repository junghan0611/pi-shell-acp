name: ci

on:
  # BRANCH pushes only. A semver TAG push rebuilds a SHA a branch push already
  # built: across this repo's whole history that happened 66/66 times, and a tag
  # run has never once reported a fact its branch run did not (#99 B-1) — the one
  # non-green tag run failed at the same step as its main run, two seconds later.
  # The exact-SHA evidence a release quotes IS the branch run, which is also the
  # run `entwurf-release` land mode reports. So tags trigger nothing here.
  push:
    branches: ['**']
  pull_request:
  # The release path fires this when the qualification BODY did not run at the
  # SHA it is about to tag: `verify-exact-ci.sh` requires that step's success as
  # its fourth axis (#103). `qualify` is the operator's explicit "run the body"
  # request; the body has no condition on it yet, so today it only records intent
  # -- but the input must EXIST for `gh workflow run ci.yml -f qualify=true` to
  # be accepted at all.
  workflow_dispatch:
    inputs:
      qualify:
        description: 'Force the check-gate-qualification body to run'
        type: boolean
        default: false

env:
  # Run all JS-based actions on Node 24 ahead of GitHub's 2026-06-02 default
  # switch (silences the "Node.js 20 actions are deprecated" annotation while
  # actions/checkout, setup-node, pnpm/action-setup are still on @v4).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Push CI owns the FULL deterministic floor (#70 tiering): `pnpm check`
      # is the operator's ≤60s everyday core, while `check:full` adds the
      # hermetic-integration and package/install tiers machine time pays for.
      - run: pnpm run check:full
      # check-gate-qualification left the default local check chains (operator
      # inner-loop cost) — its HEAD is back inside check:full above as
      # check-gate-manifests, and the BODY runs here. CI machine time re-proves
      # the gates' kill-power on every BRANCH push; a tag push rebuilds nothing,
      # because the same SHA's branch run already carries this job. So the
      # "exact release SHA has all CI jobs green" axis keeps full qualification
      # strength on exactly one run per SHA.
      - run: ./run.sh check-gate-qualification

  # The install surface has its own job because `pnpm run check:full` is a SOURCE-tree
  # floor: it can only ever prove a dev clone works. Every fence bug this repo has shipped —
  # start.sh (0.12.1), the store-doctor (0.12.4), the plugin hook (0.12.5), the agy
  # imprint plus three operator commands (0.12.7) — was green on that floor and dead once
  # installed, because Node refuses type-stripping below node_modules. check-pack-install
  # packs the real tarball, installs it, and drives the bins and commands from under
  # node_modules. It was release-gate-only until 0.12.7, which is precisely why the class
  # kept coming back. ~1 minute.
  install-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./run.sh check-pack-install

  # The artifact CONSUMER lane (#51 C). install-surface above is still a
  # maintainer-shaped proof: the checkout is present, every tree is runner-owned,
  # and the package is installed project-locally. This job hands one candidate
  # tarball, read-only, to a container that has never seen the repo — non-root
  # `npm install -g`, a frozen package directory, and the strict doctor oracle.
  # ENTWURF_REQUIRE_DOCKER=1 is the point of the job: locally a missing Docker is
  # an honest SKIP, but here an unprovable consumer lane must be RED, never a
  # silent pass. ~2 minutes.
  artifact-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ENTWURF_REQUIRE_DOCKER=1 ./run.sh check-install-container
